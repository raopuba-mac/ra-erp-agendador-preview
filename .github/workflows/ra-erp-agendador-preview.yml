name: RA ERP 5.0 - Agendador do Preview

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      operacao:
        description: 'Teste de conexao ou execucao dos lembretes'
        required: true
        default: health
        type: choice
        options:
          - health
          - lembretes

permissions:
  contents: read

concurrency:
  group: ra-erp-preview-agendador
  cancel-in-progress: false

jobs:
  verificar:
    if: github.event_name == 'workflow_dispatch' || vars.RA_CRON_ATIVO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar API protegida do RA ERP Preview
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CRON_SECRET: ${{ secrets.PREVIEW_CRON_SECRET }}
          OPERACAO: ${{ github.event_name == 'schedule' && 'lembretes' || inputs.operacao }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          BASE = 'https://ra-eletrica-automacao-git-preview-712e81-raopuba-5606s-projects.vercel.app'
          operacao = os.environ.get('OPERACAO', '')
          if operacao not in ('health', 'lembretes'):
              sys.exit('ERRO: operacao desconhecida')

          bypass = os.environ.get('BYPASS', '')
          secret = os.environ.get('CRON_SECRET', '')
          if not bypass or not secret:
              sys.exit('ERRO: faltam segredos no GitHub Actions')

          rota = '/api/cron/health' if operacao == 'health' else '/api/cron/check-reminders'
          req = urllib.request.Request(BASE + rota, headers={
              'x-vercel-protection-bypass': bypass,
              'Authorization': 'Bearer ' + secret,
              'Accept': 'application/json',
          })

          class SemRedirecionamento(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(SemRedirecionamento)
          try:
              with opener.open(req, timeout=45) as resposta:
                  status = resposta.status
                  if 'application/json' not in resposta.headers.get('Content-Type', ''):
                      sys.exit('ERRO: resposta inesperada (nao JSON)')
                  data = json.load(resposta)
          except urllib.error.HTTPError as err:
              print('Falha HTTP:', err.code)
              sys.exit(1)
          except Exception as err:
              print('Falha de conexao:', type(err).__name__)
              sys.exit(1)

          if status != 200 or data.get('success') is not True:
              sys.exit('ERRO: servidor nao confirmou sucesso')

          if operacao == 'health':
              if data.get('backend') != 'firebase-admin' or data.get('firestore') != 'connected':
                  sys.exit('ERRO: Firebase Admin/Firestore nao confirmados')
              print('OK: Preview, autenticacao e Firestore acessiveis')
          else:
              resumo = data.get('summary')
              chaves = ('agendaNotified', 'leadsNotified', 'quotesNotified', 'financialOverdueNotified')
              if not isinstance(resumo, dict) or not all(isinstance(resumo.get(k), int) and resumo[k] >= 0 for k in chaves):
                  sys.exit('ERRO: resposta do agendador incompleta')
              print('OK: execucao autorizada do agendador')
              print('Envios registrados (agenda, leads, orcamentos, financeiro):',
                    *(resumo[k] for k in chaves))
          PY
